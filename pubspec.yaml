name: interview_prep
description: AI-powered end-to-end software engineering interview simulator with voice-to-voice interviews.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.0
  intl: ^0.19.0
  uuid: ^4.3.3
  google_fonts: ^6.2.1
  file_picker: ^10.0.0
  syncfusion_flutter_pdf: ^26.1.35
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
